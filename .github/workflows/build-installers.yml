name: Build Desktop Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build jar
        run: mvn -B package -DskipTests

      - name: Prepare jpackage input
        shell: bash
        run: |
          mkdir -p dist-input
          cp target/worldbox-3d.jar dist-input/

      # A self-contained app-image (bundled JRE, no installer toolchain
      # required) so this works identically on every runner without extra
      # dependencies like WiX or rpmbuild.
      - name: Package app image
        shell: bash
        run: |
          jpackage --type app-image \
            --name WorldBox3D \
            --input dist-input \
            --main-jar worldbox-3d.jar \
            --main-class com.worldbox.Main \
            --dest dist \
            --app-version 1.0.0 \
            --vendor WorldBox3D \
            --java-options "-Xmx2g"

      - name: Zip app image (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist/WorldBox3D -DestinationPath WorldBox3D-windows.zip

      - name: Zip app image (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: cd dist && zip -r ../WorldBox3D-macos.zip WorldBox3D.app

      - name: Zip app image (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: cd dist && zip -r ../WorldBox3D-linux.zip WorldBox3D

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldBox3D-${{ matrix.platform }}
          path: WorldBox3D-${{ matrix.platform }}.zip
          retention-days: 90

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: WorldBox3D-${{ matrix.platform }}.zip
