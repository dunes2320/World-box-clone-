name: Build Desktop Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build jar
        run: mvn -B package -DskipTests

      - name: Prepare jpackage input
        shell: bash
        run: |
          mkdir -p dist-input
          cp target/worldbox-3d.jar dist-input/

      # A real installer per platform (double-click, Next-Next-Finish, get
      # a Start Menu/Applications entry and an uninstaller) rather than a
      # raw app-image folder the player has to unzip and run by hand.
      # Windows msi needs WiX (preinstalled on windows-latest); macOS dmg
      # needs only the Xcode CLI tools (preinstalled on macos-latest);
      # Linux uses deb (dpkg-deb is preinstalled on ubuntu-latest) rather
      # than rpm, which would need an extra rpmbuild install.
      - name: Package installer (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          jpackage --type msi \
            --name WorldBox3D \
            --input dist-input \
            --main-jar worldbox-3d.jar \
            --main-class com.worldbox.Main \
            --dest dist \
            --app-version 1.0.0 \
            --vendor WorldBox3D \
            --java-options "-Xmx2g" \
            --win-menu \
            --win-shortcut \
            --win-dir-chooser

      - name: Package installer (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          jpackage --type dmg \
            --name WorldBox3D \
            --input dist-input \
            --main-jar worldbox-3d.jar \
            --main-class com.worldbox.Main \
            --dest dist \
            --app-version 1.0.0 \
            --vendor WorldBox3D \
            --java-options "-Xmx2g"

      - name: Package installer (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          jpackage --type deb \
            --name WorldBox3D \
            --input dist-input \
            --main-jar worldbox-3d.jar \
            --main-class com.worldbox.Main \
            --dest dist \
            --app-version 1.0.0 \
            --vendor WorldBox3D \
            --java-options "-Xmx2g" \
            --linux-shortcut \
            --linux-menu-group Games

      - name: Locate installer file
        id: installer
        shell: bash
        run: |
          file=$(find dist -maxdepth 1 -type f \( -name "*.msi" -o -name "*.dmg" -o -name "*.deb" \))
          echo "path=$file" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$file")" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldBox3D-${{ matrix.platform }}
          path: ${{ steps.installer.outputs.path }}
          retention-days: 90

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.installer.outputs.path }}
