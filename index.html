<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WorldBox 3D Clone</title>
</head>
<body>
  <div id="app">
    <header id="topbar">
      <h1>🌍 World Box <span>3D</span></h1>
      <div id="globalStats">
        <span title="Total population">👤 <b id="statPop">0</b></span>
        <span title="Living nations">🏳️ <b id="statNations">0</b></span>
        <span title="Simulated tick">⏱ <b id="statTick">0</b></span>
      </div>
      <div id="speedControls">
        <button data-speed="0" class="speedBtn">⏸</button>
        <button data-speed="1" class="speedBtn active">▶</button>
        <button data-speed="2" class="speedBtn">▶▶</button>
        <button data-speed="4" class="speedBtn">▶▶▶</button>
      </div>
      <button id="nationsToggle" class="wideBtn small">🏳️ Nations</button>
      <button id="marketToggle" class="wideBtn small">💰 Market</button>
    </header>

    <div id="main">
      <aside id="toolbar"></aside>

      <div id="canvasWrap">
        <canvas id="world"></canvas>
        <div id="hint">Left-click: paint / select · Right-drag: rotate camera · Middle-drag: pan · Scroll: zoom</div>
      </div>

      <aside id="sidePanel" class="hidden"></aside>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
